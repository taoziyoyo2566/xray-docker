name: Audit Xray Image Tags

on:
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * 1'

concurrency:
  group: xray-image-registry-state
  cancel-in-progress: false
  queue: max

# 与 build-image.yml 保持同一发布目标。
env:
  IMAGE_NAME: taoziyoyo2566/xray-docker

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit public tags
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional read-only auth avoids the shared runner's anonymous quota.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_RO_TOKEN: ${{ secrets.DOCKERHUB_RO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          report="$(bash docker-build/audit-image-tags.sh "${IMAGE_NAME}")"
          printf '%s\n' "${report}"
          {
            echo '# Xray Docker Hub tag audit'
            echo
            echo 'This workflow is read-only and never deletes tags.'
            echo
            echo '```text'
            printf '%s\n' "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report legacy tag debt
        if: >-
          steps.audit.outputs.cleanup_count != '0' ||
          steps.audit.outputs.review_count != '0'
        env:
          CLEANUP_COUNT: ${{ steps.audit.outputs.cleanup_count }}
          REVIEW_COUNT: ${{ steps.audit.outputs.review_count }}
        shell: bash
        run: |
          echo "::warning::Legacy Docker Hub tags: cleanup=${CLEANUP_COUNT}, review=${REVIEW_COUNT}"

      - name: Fail on missing required tags
        if: steps.audit.outputs.missing_count != '0'
        env:
          MISSING_COUNT: ${{ steps.audit.outputs.missing_count }}
        shell: bash
        run: |
          echo "::error::Docker Hub is missing ${MISSING_COUNT} required tag(s)"
          exit 1

      # runbook §8 的验收条件之一。标签齐全但 latest 指向旧镜像，是这套发布里
      # 最直接的用户可见故障，而它不会让任何其它检查变红。
      # 'unknown' 不在此失败：那说明有标签缺失，上一步已经报错。
      - name: Fail when latest does not point at the current stable image
        if: steps.audit.outputs.latest_matches_stable == 'false'
        shell: bash
        run: |
          echo '::error::latest does not resolve to the current stable version tag'
          echo 'See the "latest alignment" section of the audit summary for both digests.'
          exit 1
