name: Sync Xray Release Images

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

concurrency:
  group: xray-image-registry-state
  cancel-in-progress: false

# 发布目标的唯一定义处。所有 job 与脚本调用都从这里取值。
env:
  IMAGE_NAME: taoziyoyo2566/xray-docker

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      missing_count: ${{ steps.releases.outputs.missing_count }}
      stable_tag: ${{ steps.releases.outputs.stable_tag }}
      stable_version: ${{ steps.releases.outputs.stable_version }}
      build_inputs: ${{ steps.releases.outputs.build_inputs }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover release window and missing tags
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash docker-build/discover-release-window.sh "${IMAGE_NAME}"

      - name: Report synchronization plan
        env:
          MISSING_COUNT: ${{ steps.releases.outputs.missing_count }}
          STABLE_TAG: ${{ steps.releases.outputs.stable_tag }}
        shell: bash
        run: |
          {
            echo '## Xray release synchronization plan'
            echo
            echo "- Stable tag: \`${STABLE_TAG}\`"
            echo "- Missing immutable tags: \`${MISSING_COUNT}\`"
            echo
            echo 'The window contains the newest non-draft stable release and every newer non-draft prerelease.'
          } >> "${GITHUB_STEP_SUMMARY}"

  build-missing:
    needs: discover
    if: needs.discover.outputs.missing_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.taoziyoyo.xray.version=${{ matrix.version }}
            io.taoziyoyo.xray.image-tag=${{ matrix.image_tag }}
            io.taoziyoyo.xray.channel=${{ matrix.channel }}
            io.taoziyoyo.xray.build-inputs=${{ needs.discover.outputs.build_inputs }}

      - name: Build and push image candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker-build
          file: ./docker-build/dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            XRAY_VERSION=${{ matrix.version }}
            XRAY_SHA256_AMD64=${{ matrix.amd64_sha }}
            XRAY_SHA256_ARM64=${{ matrix.arm64_sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=xray-${{ matrix.image_tag }}
          cache-to: type=gha,mode=max,scope=xray-${{ matrix.image_tag }}
          # provenance 默认已开（mode=min）；提到 max 以记录完整构建来源。
          # SBOM 与 index annotations 无关，不受该项未验证状态影响。
          # 两者都产生 unknown/unknown 的 attestation manifest，
          # verify-image.sh 只取 platform.os == "linux"，因此不受影响。
          provenance: mode=max
          sbom: true

      - name: Verify pushed multi-platform image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ matrix.version }}
        shell: bash
        run: bash docker-build/verify-image.sh "${IMAGE_REF}" "${VERSION}"

      - name: Publish version tag
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ matrix.image_tag }}
        shell: bash
        run: docker buildx imagetools create --tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_REF}"

      - name: Report published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ matrix.image_tag }}
          VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          {
            echo "## Published ${IMAGE_TAG}"
            echo
            echo "- Xray version: \`${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platforms: \`linux/amd64,linux/arm64\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  reconcile-latest:
    needs: [discover, build-missing]
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      (needs.build-missing.result == 'success' || needs.build-missing.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      STABLE_TAG: ${{ needs.discover.outputs.stable_tag }}
      STABLE_VERSION: ${{ needs.discover.outputs.stable_version }}
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve stable and latest digests
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          read_digest() {
            local tag="$1"
            curl --fail --silent --show-error --location \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}" \
              | jq -r '.digest'
          }
          stable_digest=''
          for attempt in 1 2 3 4 5; do
            stable_digest="$(read_digest "${STABLE_TAG}" 2>/dev/null || true)"
            [[ "${stable_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            sleep 5
          done
          if [[ ! "${stable_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "stable tag is unavailable after synchronization: ${STABLE_TAG}" >&2
            exit 1
          fi
          latest_digest="$(read_digest latest 2>/dev/null || true)"
          {
            echo "stable_digest=${stable_digest}"
            echo "move_latest=$([[ "${latest_digest}" == "${stable_digest}" ]] && echo false || echo true)"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Verify current stable image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.tags.outputs.stable_digest }}
        shell: bash
        run: bash docker-build/verify-image.sh "${IMAGE_REF}" "${STABLE_VERSION}"

      - name: Login to Docker Hub
        if: steps.tags.outputs.move_latest == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move latest to verified stable
        if: steps.tags.outputs.move_latest == 'true'
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.tags.outputs.stable_digest }}
        shell: bash
        run: docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_REF}"

      - name: Report stable identity
        env:
          DIGEST: ${{ steps.tags.outputs.stable_digest }}
          MOVED: ${{ steps.tags.outputs.move_latest }}
        shell: bash
        run: |
          {
            echo '## Current stable image'
            echo
            echo "- Version tag: \`${STABLE_TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- latest moved: \`${MOVED}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Docker Hub 的 Overview 是使用者看到的第一屏，而它无法从 registry 推送中获得。
  # 必须在发布成功之后运行：仓库在首次推送前并不存在。
  sync-overview:
    needs: reconcile-latest
    # always() 用来关掉隐式的 success()：不含状态函数的 if 会被隐式加上
    # success()，而它评估整条依赖图，无缺失标签时被跳过的 build-missing
    # 会让它判假，Overview 便永远不更新。加上后只看直接依赖的结果。
    if: always() && needs.reconcile-latest.result == 'success'

    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync README to Docker Hub overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # 需要具备写权限的 PAT；仅有 push 权限的令牌无法改写 Overview。
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md
